name: VinLauncher Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vinlauncher-release
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os_key: linux
            ext: AppImage
          - platform: windows-latest
            os_key: windows
            ext: exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          save-cache: true
          restore-cache: true

      - name: (Linux) Install system dependencies
        if: matrix.os_key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang python3 \
            libfontconfig-dev libfreetype-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libdbus-1-dev \
            libfuse2

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Build release binary
        shell: bash
        run: cargo build --release --bin oneclient_app

      - name: (Windows) Stage app-local VC++ runtime
        if: matrix.os_key == 'windows'
        shell: bash
        run: python3 distribution/windows/bundle-crt.py

      - name: Package
        shell: bash
        env:
          CI: 'true'
        run: cargo packager --release --verbose

      - name: (Linux) Upload AppImage
        if: matrix.os_key == 'linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          f="$(ls target/release/*.AppImage | head -n1)"
          base="VinLauncher_1.0.0_linux_x64.AppImage"
          cp "$f" "$base"
          gh release upload v1.0.0 "$base" --clobber --repo "$GITHUB_REPOSITORY"

      - name: (Windows) Locate installer
        if: matrix.os_key == 'windows'
        id: win_installer
        shell: bash
        run: echo "path=$(ls target/release/*-setup.exe | head -n1)" >> "$GITHUB_OUTPUT"

      - name: (Windows) Smoke-test installer layout
        if: matrix.os_key == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\vinlauncher-smoke'
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          $exe = Resolve-Path '${{ steps.win_installer.outputs.path }}'
          # NSIS: /S is silent, /D= sets the install dir and must be the last arg.
          $p = Start-Process -FilePath $exe -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exited $($p.ExitCode)"; exit 1 }

          if (-not (Test-Path "$dest\oneclient_app.exe")) {
            Write-Error "oneclient_app.exe is not at the root of $dest"
            exit 1
          }
          foreach ($dll in @(Get-ChildItem 'target/crt/*.dll')) {
            if (-not (Test-Path (Join-Path $dest $dll.Name))) {
              Write-Error "$($dll.Name) did not land beside oneclient_app.exe"
              exit 1
            }
          }
          Write-Host "OK: CRT DLLs sit beside oneclient_app.exe"

      - name: (Windows) Upload installer
        if: matrix.os_key == 'windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH_EXE: ${{ steps.win_installer.outputs.path }}
        run: |
          set -euo pipefail
          base="VinLauncher_1.0.0_windows_x64-setup.exe"
          cp "$PATH_EXE" "$base"
          gh release upload v1.0.0 "$base" --clobber --repo "$GITHUB_REPOSITORY"
