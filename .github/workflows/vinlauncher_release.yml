name: VinLauncher Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vinlauncher-release
  cancel-in-progress: false

jobs:
  package:
    outputs:
      version: ${{ steps.art.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os_key: linux
            fmt: appimage
            pattern: '*.AppImage'
          - platform: windows-latest
            os_key: windows
            fmt: nsis
            pattern: '*-setup.exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          save-cache: true
          restore-cache: true

      - name: (Linux) Install system dependencies
        if: matrix.os_key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang python3 \
            libfontconfig-dev libfreetype-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libdbus-1-dev \
            libfuse2

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Build release binary
        shell: bash
        run: cargo build --release --bin oneclient_app

      - name: (Windows) Stage app-local VC++ runtime
        if: matrix.os_key == 'windows'
        shell: bash
        run: python3 distribution/windows/bundle-crt.py

      - name: Package (signs the updater artifact)
        shell: bash
        env:
          CI: 'true'
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ''
        run: cargo packager --release --formats ${{ matrix.fmt }} --verbose

      - name: Locate updater artifact
        id: art
        shell: bash
        run: |
          echo "path=$(ls target/release/${{ matrix.pattern }} | head -n1)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n -E '/^\[workspace\.package\]/,/^\[/ s/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - name: (Windows) Smoke-test installer layout
        if: matrix.os_key == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\vinlauncher-smoke'
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          $exe = Resolve-Path '${{ steps.art.outputs.path }}'
          # NSIS: /S is silent, /D= sets the install dir and must be the last arg.
          $p = Start-Process -FilePath $exe -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exited $($p.ExitCode)"; exit 1 }

          if (-not (Test-Path "$dest\oneclient_app.exe")) {
            Write-Error "oneclient_app.exe is not at the root of $dest"
            exit 1
          }
          foreach ($dll in @(Get-ChildItem 'target/crt/*.dll')) {
            if (-not (Test-Path (Join-Path $dest $dll.Name))) {
              Write-Error "$($dll.Name) did not land beside oneclient_app.exe"
              exit 1
            }
          }
          Write-Host "OK: CRT DLLs sit beside oneclient_app.exe"

      - name: Sign updater artifact
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ''
          PATH_ART: ${{ steps.art.outputs.path }}
        run: |
          cargo packager signer sign --private-key "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" --password "" "$PATH_ART"
          test -e "$PATH_ART.sig" || { echo "::error::no .sig produced"; exit 1; }

      - name: Upload assets + manifest fragment
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OS_KEY: ${{ matrix.os_key }}
          FMT: ${{ matrix.fmt }}
          PATH_ART: ${{ steps.art.outputs.path }}
          VERSION: ${{ steps.art.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          base="VinLauncher_${VERSION}_${OS_KEY}_x64"
          case "$OS_KEY" in
            windows) ext="setup.exe" ;;
            linux)   ext="AppImage" ;;
          esac
          cp "$PATH_ART" "$base.$ext"
          cp "$PATH_ART.sig" "$base.$ext.sig"

          # Ensure the release exists (draft not needed; publishing makes it the
          # "latest" release so releases/latest/download/latest.json resolves).
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "VinLauncher $VERSION" --notes "VinLauncher $VERSION"
          gh release upload "$TAG" "$base.$ext" "$base.$ext.sig" --clobber --repo "$GITHUB_REPOSITORY"

          FRAG_NAME="${OS_KEY}-x86_64" \
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$base.$ext" \
          SIG="$(cat "$PATH_ART.sig")" \
          python3 - <<'PY'
          import json, os
          os.makedirs("fragments", exist_ok=True)
          entry = {
            "signature": os.environ["SIG"],
            "url": os.environ["URL"],
            "format": os.environ["FMT"],
          }
          with open(f"fragments/{os.environ['FRAG_NAME']}.json", "w") as f:
              json.dump({os.environ["FRAG_NAME"]: entry}, f)
          PY

      - name: Upload manifest fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-${{ matrix.os_key }}
          path: fragments/*.json

  manifest:
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: manifest-*
          path: fragments
          merge-multiple: true

      - name: Assemble latest.json
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, glob, os, datetime
          platforms = {}
          for path in glob.glob("fragments/*.json"):
              with open(path) as f:
                  platforms.update(json.load(f))
          manifest = {
              "version": os.environ["VERSION"],
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          TAG="v$VERSION"
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
